      list.innerHTML = '';
      const playerArr = Object.values(appState.players);
      document.getElementById('lobby-player-count').textContent = playerArr.length;

      if (playerArr.length === 0) {
        list.innerHTML = `
          <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 3rem;">
            Esperando a que los alumnos escaneen el QR e ingresen su nombre...
          </div>
        `;
        return;
      }

      playerArr.forEach(p => {
        const item = document.createElement('div');
        item.className = 'player-pill';
        item.innerHTML = `
          <span style="font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.5rem;">
            <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span>
            ${p.name}
          </span>
          <span style="font-size: 0.75rem; color: #10b981; font-weight: 700;">✓ Conectado</span>
        `;
        list.appendChild(item);
      });
    }

    // ETAPA 2 -> ETAPA 3: Iniciar Ronda 1 (Pasa a Monitor de Ronda Activa)
    document.getElementById('btn-start-game').addEventListener('click', () => {
      audio.bellStart();
      appState.currentRound = 1;
      showTeacherStage(3);
      startRoundForSession();
    });

    function startRoundForSession() {
      let dim = parseInt(appState.config.dim) || 4;
      const seed = Math.floor(Math.random() * 9000000) + 1000;
      const matrix = generateMatrix(dim, dim, seed);
      const sum = matrix.reduce((acc, c) => acc + c.value, 0);
      const root = calculateDigitalRoot(sum);

      appState.currentMatrix = matrix;
      appState.solutionDigit = root;
      appState.roundStartTime = Date.now();

      // Resetear estado de jugadores para la nueva ronda
      Object.keys(appState.players).forEach(id => {
        appState.players[id].completed = false;
        appState.players[id].time = 0;
      });

      const roundPayload = {
        round: appState.currentRound,
        totalRounds: parseInt(appState.config.rounds) || 5,
        mode: getActiveRoundMode(),
        dim: dim,
        seed: seed,
        timer: parseInt(appState.config.timer) || 0,
        startTime: appState.roundStartTime
      };

      syncBroadcast('game_started', roundPayload);
      setupTeacherLiveView(roundPayload);
    }

    function getActiveRoundMode() {
      return appState.config.mode || 'reduccion';
    }

    function setupTeacherLiveView(data) {
      showTeacherStage(3);
      document.getElementById('live-round-badge').textContent = `RONDA ${data.round}/${data.totalRounds}`;
      const modeNames = {
        'reduccion': 'MODO REDUCCIÓN (9s)',
        'tradicional': 'MODO TRADICIONAL',
        'libre': 'MODO LIBRE'
      };
      document.getElementById('live-mode-badge').textContent = modeNames[data.mode] || 'MODO REDUCCIÓN';
      document.getElementById('teacher-solution-display').textContent = `Solución: Dígito ${appState.solutionDigit}`;

      // Render mini cuadrícula en proyector
      const matrixContainer = document.getElementById('teacher-matrix-container');
      matrixContainer.innerHTML = '';
      matrixContainer.style.gridTemplateColumns = `repeat(${data.dim}, 1fr)`;
      appState.currentMatrix.forEach(c => {
        const cell = document.createElement('div');
        cell.className = 'matrix-cell-teacher';
        cell.textContent = c.value;
        matrixContainer.appendChild(cell);
      });

      updateTeacherLiveStatusUI();
      startTeacherTimer(data.timer);
    }

    let liveTimerInterval = null;
    function startTeacherTimer(limitSec) {
      if (liveTimerInterval) clearInterval(liveTimerInterval);
      const timerDisplay = document.getElementById('live-timer-display');
      const start = Date.now();

      liveTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - start) / 1000);
        if (limitSec > 0) {
          const remaining = Math.max(0, limitSec - elapsed);
          timerDisplay.textContent = `⏱ 00:${remaining.toString().padStart(2, '0')}`;
          if (remaining === 0) {
            clearInterval(liveTimerInterval);
            audio.buzz();
            confetti({ particleCount: 50, spread: 60 });
          }
        } else {
          timerDisplay.textContent = `⏱ 00:${elapsed.toString().padStart(2, '0')}`;
        }
      }, 500);
    }

    function updateTeacherLiveStatusUI() {
      const container = document.getElementById('live-players-status-container');
      if (!container) return;
      container.innerHTML = '';

      const players = Object.values(appState.players);
      const completedCount = players.filter(p => p.completed).length;
      document.getElementById('live-completion-ratio').textContent = `${completedCount} / ${players.length} completados`;

      players.forEach(p => {
        const row = document.createElement('div');
        row.className = `status-row ${p.completed ? 'completed' : ''}`;
        
        // REGLA CRÍTICA DE PRIVACIDAD: PROHIBIDO mostrar la respuesta numérica que ingresaron
        const statusHtml = p.completed
          ? `<span class="badge-status badge-done">✓ Terminado (${p.time}s)</span>`
          : `<span class="badge-status badge-thinking">Pensando...</span>`;

        row.innerHTML = `
          <span style="font-weight: 700; color: #fff;">${p.name}</span>
          ${statusHtml}
        `;
        container.appendChild(row);
      });

      // Si todos han completado, disparar alerta y confeti para el profesor
      if (players.length > 0 && completedCount === players.length) {
        if (liveTimerInterval) clearInterval(liveTimerInterval);
        audio.fanfare();
        confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 } });
      }
    }

    // Siguiente Ronda (habilitado en cualquier momento si decide saltar o continuar)
    document.getElementById('btn-next-round').addEventListener('click', () => {
      audio.init();
      if (appState.currentRound < parseInt(appState.config.rounds)) {
        appState.currentRound++;
        showTeacherStage(3);
        startRoundForSession();
      } else {
        // Fin del torneo -> Pódium
        finishTournamentAndShowPodium();
      }
    });

    // Finalizar partida y volver a la configuración del profesor
    const btnEndSession = document.getElementById('btn-end-session');
    if (btnEndSession) {
      btnEndSession.addEventListener('click', () => {
        audio.init();
        const confirmEnd = window.confirm("¿Deseas finalizar la sesión actual y regresar a la configuración?");
        if (!confirmEnd) return;

        // 1. Detener temporizador de la ronda activa
        if (liveTimerInterval) {
          clearInterval(liveTimerInterval);
          liveTimerInterval = null;
        }

        // 2. Actualizar estado en Firebase Realtime Database
        if (isFirebaseActive && db && appState.roomCode) {
          db.ref(`rooms/${appState.roomCode}`).update({
            state: 'closed',
            closedAt: Date.now()
          }).catch(err => {
            console.warn("Aviso al actualizar estado de sala en Firebase:", err);
          });
        }

        // 3. Notificar a los participantes conectados
        syncBroadcast('room_closed', {
          room: appState.roomCode,
          reason: 'teacher_ended'
        });

        // 4. Limpiar estado de juego y participantes de la sesión finalizada
        appState.players = {};
        appState.currentRound = 1;
        appState.currentMatrix = [];

        // 5. Ocultar el tablero de juego en vivo y regresar limpiamente a la pantalla de Ajustes (Pantalla 1)
        switchView('view-teacher');
        showTeacherStage(1);
      });
    }

    function finishTournamentAndShowPodium() {
      if (liveTimerInterval) clearInterval(liveTimerInterval);
      audio.fanfare();
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });

      // Calcular ranking por aciertos, menor número de fallos y menor tiempo acumulado
      const sorted = Object.values(appState.players).sort((a, b) => {
        const scoreA = a.score || 0;
        const scoreB = b.score || 0;
        if (scoreB !== scoreA) return scoreB - scoreA;
        const attA = a.attempts || 1;
        const attB = b.attempts || 1;
        if (attA !== attB) return attA - attB;
        return (a.totalTime || 999) - (b.totalTime || 999);
      });

      syncBroadcast('game_finished', { ranking: sorted });
      renderPodiumUI(sorted);
    }

    function renderPodiumUI(sorted) {
      switchView('view-podium');

      document.getElementById('podium-name-1').textContent = sorted[0] ? sorted[0].name : '-';
      document.getElementById('podium-score-1').textContent = sorted[0] ? `${sorted[0].score || 0} pts` : '';

      document.getElementById('podium-name-2').textContent = sorted[1] ? sorted[1].name : '-';
      document.getElementById('podium-score-2').textContent = sorted[1] ? `${sorted[1].score || 0} pts` : '';

      document.getElementById('podium-name-3').textContent = sorted[2] ? sorted[2].name : '-';
      document.getElementById('podium-score-3').textContent = sorted[2] ? `${sorted[2].score || 0} pts` : '';

      const fullList = document.getElementById('leaderboard-full-list');
      fullList.innerHTML = '';
      sorted.forEach((p, idx) => {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.padding = '0.4rem 0.6rem';
        row.style.fontSize = '0.85rem';
        row.style.borderBottom = '1px solid #1e293b';
        row.innerHTML = `
          <span><strong>#${idx + 1}</strong> ${p.name}</span>
          <span style="color: #f59e0b; font-weight: 700;">${p.score || 0} aciertos</span>
        `;
        fullList.appendChild(row);
      });
    }

    document.getElementById('btn-new-tournament').addEventListener('click', () => {
      switchView('view-teacher');
      showTeacherStage(1);
    });

    /* =========================================================
       8. FLUJO DEL ALUMNO (MÓVIL RESPONSIVO)
       ========================================================= */
    document.getElementById('btn-student-connect').addEventListener('click', () => {
      audio.init();
      const name = document.getElementById('student-name-input').value.trim();
      const room = document.getElementById('student-room-input').value.trim().toUpperCase();

      if (!name) {
        alert("Por favor, ingresa tu nombre o alias.");
        return;
      }
      if (!room) {
        alert("Ingresa el código de la sala.");
        return;
      }

      appState.studentName = name;
      appState.roomCode = room;

      attachFirebaseListeners(room);

      // Notificar unión al profesor
      syncBroadcast('player_joined', {
        id: appState.studentId,
        name: name,
        score: 0,
        attempts: 0,
        totalTime: 0
      });

      switchView('view-student-waiting');
    });

    function handleGameStarted(data) {
      if (appState.role !== 'student') return;
      audio.bellStart();

      appState.currentRound = data.round;
      appState.currentMatrix = generateMatrix(data.dim, data.dim, data.seed);
      const sum = appState.currentMatrix.reduce((acc, c) => acc + c.value, 0);
      appState.solutionDigit = calculateDigitalRoot(sum);
      appState.roundStartTime = Date.now();

      // Reset estado local
      appState.studentState = {
        markedIds: new Set(),
        eliminatedIds: new Set(),
        selectedIds: [],
        typedDigit: null,
        attempts: 0,
        hasSubmitted: false
      };

      document.getElementById('student-round-num').textContent = data.round;
      document.getElementById('student-total-rounds').textContent = data.totalRounds;
      const studentModeNames = {
        'reduccion': 'REDUCCIÓN (9s)',
        'tradicional': 'TRADICIONAL',
        'libre': 'MODO LIBRE'
      };
      document.getElementById('student-mode-name').textContent = studentModeNames[data.mode] || 'REDUCCIÓN (9s)';
      document.getElementById('student-visor-digit').textContent = '-';
      document.getElementById('btn-student-submit').disabled = true;

      renderStudentBoard(data.mode, data.dim);
      startStudentTimer(data.timer);
      switchView('view-student-game');
    }

    function renderStudentBoard(mode, dim) {
      const grid = document.getElementById('student-matrix-grid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = `repeat(${dim}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${dim}, 1fr)`;

      appState.currentMatrix.forEach(cell => {
        const cellEl = document.createElement('div');
        cellEl.className = 'grid-cell';
        cellEl.textContent = cell.value;
        cellEl.dataset.id = cell.id;

        cellEl.addEventListener('click', () => {
          handleStudentCellClick(cell, cellEl, mode);
        });

        grid.appendChild(cellEl);
      });
    }

    function handleStudentCellClick(cell, cellEl, mode) {
      if (appState.studentState.hasSubmitted) return;
      audio.tap();

      if (mode === 'tradicional' || mode === 'libre') {
        // Sombreado libre para control de cálculo mental progresivo
        if (appState.studentState.markedIds.has(cell.id)) {
          appState.studentState.markedIds.delete(cell.id);
          cellEl.classList.remove('highlighted-trad');
        } else {
          appState.studentState.markedIds.add(cell.id);
          cellEl.classList.add('highlighted-trad');
        }
      } else {
        // Modo Reducción:
        // 1. Ceros y Nueves directos
        if (cell.value === 0 || cell.value === 9) {
          appState.studentState.eliminatedIds.add(cell.id);
          cellEl.classList.add('eliminated-red');
          audio.groupMatch();
          return;
        }

        // Si ya está eliminada, ignorar
        if (appState.studentState.eliminatedIds.has(cell.id)) return;

        // 2. Selección libre consecutiva (sin límite de celdas)
        const selIdx = appState.studentState.selectedIds.indexOf(cell.id);
        if (selIdx >= 0) {
          appState.studentState.selectedIds.splice(selIdx, 1);
          cellEl.classList.remove('selected-red');
        } else {
          appState.studentState.selectedIds.push(cell.id);
          cellEl.classList.add('selected-red');

          // Evaluar suma del grupo seleccionado
          const selectedCells = appState.currentMatrix.filter(c => appState.studentState.selectedIds.includes(c.id));
          const currentSum = selectedCells.reduce((acc, c) => acc + c.value, 0);

          // Si suma 9 o reduce a 9 (ej. 18, 27)
          if (currentSum > 0 && currentSum % 9 === 0 && appState.studentState.selectedIds.length >= 2) {
            audio.groupMatch();
            appState.studentState.selectedIds.forEach(id => {
              appState.studentState.eliminatedIds.add(id);
              const el = document.querySelector(`.grid-cell[data-id="${id}"]`);
              if (el) {
                el.classList.remove('selected-red');
                el.classList.add('eliminated-red');
              }
            });
            appState.studentState.selectedIds = [];
          }
        }
      }
    }

    // Teclado táctil integrado
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (appState.studentState.hasSubmitted) return;
        audio.tap();
        const digit = parseInt(btn.dataset.key);
        appState.studentState.typedDigit = digit;
        document.getElementById('student-visor-digit').textContent = digit;
        document.getElementById('btn-student-submit').disabled = false;
      });
    });

    // Envío y comprobación estricta sin spoiler
    document.getElementById('btn-student-submit').addEventListener('click', () => {
      if (appState.studentState.hasSubmitted || appState.studentState.typedDigit === null) return;
      audio.init();

      const typed = appState.studentState.typedDigit;
      const isCorrect = (typed === appState.solutionDigit) || (appState.solutionDigit === 9 && typed === 0);

      appState.studentState.attempts++;

      if (isCorrect) {
        // Respuesta Correcta
        audio.groupMatch();
        appState.studentState.hasSubmitted = true;
        document.getElementById('btn-student-submit').disabled = true;
        document.getElementById('btn-student-submit').textContent = "✓ ¡Respuesta Enviada!";

        const timeTaken = ((Date.now() - appState.roundStartTime) / 1000).toFixed(1);

        // Notificar al profesor
        syncBroadcast('player_completed', {
          id: appState.studentId,
          name: appState.studentName,
          time: parseFloat(timeTaken),
          attempts: appState.studentState.attempts,
          isCorrect: true
        });

        showToastFeedback("¡Excelente! Cálculo correcto enviado.");
      } else {
        // REGLA ESTRICTA DE ERROR: NUNCA DECIRLE LA RESPUESTA CORRECTA
        audio.buzz();
        showToastFeedback("Cálculo incorrecto. Revisa tu reducción y vuelve a intentar.");
        // Registrar intento pero dejar que siga intentando
        syncBroadcast('player_attempt_failed', {
          id: appState.studentId,
          attempts: appState.studentState.attempts
        });
      }
    });

    function showToastFeedback(msg) {
      const toast = document.getElementById('toast-feedback');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2200);
    }

    let studentTimerInterval = null;
    function startStudentTimer(limitSec) {
      if (studentTimerInterval) clearInterval(studentTimerInterval);
      const timerBox = document.getElementById('student-timer-box');
      const start = Date.now();

      studentTimerInterval = setInterval(() => {
        const elapsed = ((Date.now() - start) / 1000).toFixed(1);
        timerBox.innerHTML = `⏱ <strong>${elapsed}s</strong>`;
      }, 200);
    }

    function handleNextRoundReceived(data) {
      if (appState.role === 'student') {
        handleGameStarted(data);
      }
    }

    function handlePodiumReceived(data) {
      if (studentTimerInterval) clearInterval(studentTimerInterval);
      renderPodiumUI(data.ranking);
    }

    function handleRoomClosedReceived() {
      if (appState.role === 'student') {
        if (studentTimerInterval) clearInterval(studentTimerInterval);
        alert("El docente ha finalizado la sesión o cerrado la sala.");
        switchView('view-student-join');
      }
    }

    // Control de Pantalla Completa
    const btnTallerFs = document.getElementById('btn-toggle-taller-fullscreen');
    if (btnTallerFs) {
      btnTallerFs.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => console.warn(err));
          btnTallerFs.textContent = '✕';
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch((err) => console.warn(err));
            btnTallerFs.textContent = '⛶';
          }
        }
      });
    }

    document.addEventListener('fullscreenchange', () => {
      if (btnTallerFs) {
        btnTallerFs.textContent = document.fullscreenElement ? '✕' : '⛶';
      }
    });

    // Activar pantalla completa al interactuar por primera vez
    const handleFirstUserTouch = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      window.removeEventListener('click', handleFirstUserTouch);
      window.removeEventListener('touchstart', handleFirstUserTouch);
    };
    window.addEventListener('click', handleFirstUserTouch, { once: true });
    window.addEventListener('touchstart', handleFirstUserTouch, { once: true });

    // Auto-detección por parámetro en URL para alumnos al escanear QR y control de acceso
    window.addEventListener('DOMContentLoaded', () => {
      const isStudent = isStudentUrlException();
      if (isStudent) {
        // Excepción de Alumnos: Acceso directo sin contraseña ni modal
        hideAuthModal();
        const params = new URLSearchParams(window.location.search);
        const code = (params.get('sala') || params.get('room') || '').toUpperCase();
        if (code) {
          const roomInput = document.getElementById('student-room-input');
          if (roomInput) roomInput.value = code;
        }
        appState.role = 'student';
        switchView('view-student-join');
      } else {
        // Pantalla de control / Máster: exige autenticación o licencia válida
        if (!checkTeacherAuth()) {
          showAuthModal();
        } else {
          hideAuthModal();
        }
      }
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
